    ];

    let currentWords = [];
    let score = 0;
    let canClick = true;

    function startGame() {
        currentWords = [...dictionary].sort(() => Math.random() - 0.5);
        score = 0;
        updateUI();
    }

    function updateUI() {
        if (currentWords.length === 0) {
            document.querySelector(".card").innerHTML = `<h2>انتهى الاختبار!</h2><p>نقاطك: ${score}/${dictionary.length}</p><button onclick="location.reload()" style="background:#3498db; color:white; border:none; padding:15px; border-radius:10px; width:100%">إعادة محاولة</button>`;
            return;
        }

        canClick = true;
        const current = currentWords[0];
        document.getElementById('wordDisplay').innerText = current.en;
        document.getElementById('score').innerText = score;
        document.getElementById('remaining').innerText = currentWords.length;

        // توليد خيارات عشوائية
        let options = [current.ar];
        while (options.length < 4) {
            let randomWord = dictionary[Math.floor(Math.random() * dictionary.length)].ar;
            if (!options.includes(randomWord)) options.push(randomWord);
        }
        options.sort(() => Math.random() - 0.5);

        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn) {
        if (!canClick) return;
        canClick = false;

        const correct = currentWords[0].ar;
        if (selected === correct) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            // إظهار الإجابة الصحيحة
            Array.from(document.getElementsByClassName('option-btn')).forEach(b => {
                if (b.innerText === correct) b.classList.add('correct');
            });
        }

        currentWords.shift();
        setTimeout(updateUI, 1200);
    }

    window.onload = startGame;
